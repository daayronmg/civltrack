  --f-doc:"IBM Plex Sans",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{

}

::-webkit-scrollbar{width:0;height:0}

#term{
  position:relative;width:100%;max-width:520px;margin:0 auto;min-height:100dvh;

  background:
    radial-gradient(120% 55% at 50% 0%, #10201800 60%, #0A130E 100%),
    linear-gradient(180deg,#08110C,#070C09);
  box-shadow:0 0 0 1px var(--line);overflow:hidden;
}
#term::after{ /* barrido CRT muy sutil */

  background:repeating-linear-gradient(180deg,rgba(255,255,255,.016) 0 1px,transparent 1px 3px);

#bar{padding:8px 10px calc(10px + var(--safe-b));border-top:1px solid var(--line);background:#0A140F;display:flex;flex-direction:column;gap:8px}

h3{font-size:16px;text-transform:uppercase;letter-spacing:.06em}

.cap{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.08em}

.cur::after{content:"█";animation:blink 1s steps(1) infinite;color:var(--green-hi)}
@keyframes blink{50%{opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(3px)}50%{transform:translateX(-4px)}}
.fade{animation:fade .22s ease}
.pop{animation:pop .3s cubic-bezier(.2,1.5,.4,1)}

#lock{

@media (max-height:700px){h1{font-size:23px}.btn{min-height:44px}}

function nuevoDni(){ return dniDe(ri(11000000, 79999999)); }
function nuevaMat(){
  const L = 'BCDFGHJKLMNPRSTVWXYZ';
  return pad(ri(0,9999),4) + ' ' + L[ri(0,19)] + L[ri(0,19)] + L[ri(0,19)];
}
function nuevoTel(){ return (chance(.85)?'6':'7') + pad(ri(0,99999999),8); }
function nuevoIban(){
  let n = '';
  for(let i=0;i<20;i++) n += ri(0,9);
  return 'ES' + pad(ri(10,99),2) + ' ' + n.slice(0,4) + ' ' + n.slice(4,8) + ' ' + n.slice(8,12) + ' ' + n.slice(12,16) + ' ' + n.slice(16,20);
}
function fechaNac(minEdad, maxEdad){
  const hoy = new Date();
  const edad = ri(minEdad||19, maxEdad||72);
  return {d:ri(1,28), m:ri(1,12), y:hoy.getFullYear()-edad, edad};
}
const fmtF = f => `${pad(f.d)}/${pad(f.m)}/${f.y}`;
function sumaDias(f, n){
  const base = f.ts ? new Date(f.ts) : new Date(f.y, f.m-1, f.d);
  const d = new Date(base.getTime() + n*86400000);
  return {d:d.getDate(), m:d.getMonth()+1, y:d.getFullYear(), ts:d.getTime()};
}
const fmtH = m => `${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const DIAS = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];

/* ── base de datos ── */
const DB = {per:[], veh:[], emp:[], byDni:{}, byTel:{}, byMat:{}, byId:{}};
function nuevaPersona(i){
  const sexo = chance(.52) ? 'H' : 'M';
  const nombre = sexo==='H' ? pk(NOM_M) : pk(NOM_F);
  const f = fechaNac(19, 74);
  const mun = pk(MUN);
  const p = {
    id:'P'+pad(i,4), sexo, nombre, ape1:pk(APE), ape2:pk(APE), fnac:f,
    dni:nuevoDni(), nac: chance(.86)?'Española':pk(['Marroquí','Rumana','Colombiana','Italiana','Portuguesa','Ecuatoriana','Búlgara','Británica']),
    dom:{via:pk(VIA), nom:pk(VIA_N), num:ri(1,180), piso: chance(.7)? `${ri(1,8)}º ${pk('ABCD')}` : '—',
         mun:mun[0], prov:mun[1], cp: mun[2] + pad(ri(1,60),2)},
    tel:[nuevoTel()].concat(chance(.35)?[nuevoTel()]:[]),
    prof:pk(PROF), senas: pk(SENAS) + ' · ' + pk(RASGOS),
    ant:[], veh:[], vinc:[], req:null, notas:[], riesgo:0,
    cuenta:{iban:nuevoIban(), banco:pk(BANCOS), saldo: Math.round(rr(120, 24000))},
    foto: f.edad > 62
      ? (sexo==='H' ? pk(['👴','👨‍🦲']) : pk(['👵','👩‍🦳']))
      : (sexo==='H' ? pk(['👨','🧔','👨‍🦲','👨‍🦱','🧑']) : pk(['👩','👩‍🦰','🧑‍🦱','👱‍♀️','🧕']))
  };
  const nAnt = chance(.34) ? ri(1,4) : 0;
  for(let k=0;k<nAnt;k++){
    const d = pk(DELITOS);
    p.ant.push({art:d[0], del:d[1], fecha:{d:ri(1,28), m:ri(1,12), y:ri(2011, 2025)}, res:pk(RESOL),
                jz:`Juzgado de Instrucción nº ${ri(1,12)} de ${p.dom.mun}`});
  }
  p.ant.sort((a,b)=>b.fecha.y-a.fecha.y);
  p.riesgo = clampi(p.ant.length + (p.ant.some(a=>['Art. 242 CP','Art. 570 bis CP','Art. 368 CP'].includes(a.art))?2:0), 0, 5);
  if(p.ant.length && chance(.10)) p.req = {org:`Juzgado de Instrucción nº ${ri(1,10)} de ${pk(MUN)[0]}`, mot:pk(['Comparecencia','Orden de detención','Busca y personación']), fecha:{d:ri(1,28),m:ri(1,12),y:ri(2024,2026)}};
  if(chance(.16)) p.alias = pk(['El Rubio','El Chino','Tito','Nano','El Flaco','Kiko','El Zurdo','Curro','El Largo','Pitu','El Moro','Cheo','El Pelón','Manu','El Gordo']);
  if(chance(.22)) p.notas.push(pk([
    'Identificado en control preventivo de madrugada sin justificar su presencia.',
    'Figura como titular de un local de hostelería con expediente de sanción abierto.',
    'Ha cambiado tres veces de domicilio en los últimos dos años.',
    'Se le relaciona con ambientes de compraventa de vehículos de segunda mano.',
    'Consta comunicación de operación sospechosa remitida por su entidad bancaria.',
    'Colabora ocasionalmente como informador con unidades territoriales.'
  ]));
  return p;
}
function clampi(v,a,b){ return Math.max(a, Math.min(b, v)); }
function nuevoVehiculo(i, titular){
  const m = pk(MARCA);
  return {
    id:'V'+pad(i,4), mat:nuevaMat(), marca:m[0], modelo:m[1], color:pk(COLOR),
    año: ri(2004, 2025), titular: titular.id,
    seguro: chance(.88) ? pk(['MUTUA IBÉRICA','SEGUROS DEL SUR','ATLAS SEGUROS','PENÍNSULA SEGUROS']) : null,
    itv: chance(.82) ? 'Favorable · caduca ' + pad(ri(1,28)) + '/' + pad(ri(1,12)) + '/' + ri(2026,2028) : 'DESFAVORABLE · caducada',
    inc: []
  };
}
function nombreCompleto(p){ return `${p.nombre} ${p.ape1} ${p.ape2}`; }
function edadDe(p){ return p.fnac.edad; }
function domTexto(p){ return `${p.dom.via} ${p.dom.nom}, ${p.dom.num}${p.dom.piso!=='—'?', '+p.dom.piso:''} · ${p.dom.cp} ${p.dom.mun} (${p.dom.prov})`; }

function generarMundo(seed){
  RND = mulberry32(seed);
  DB.per = []; DB.veh = []; DB.emp = []; DB.byDni = {}; DB.byTel = {}; DB.byMat = {}; DB.byId = {};
  for(let i=1;i<=340;i++) DB.per.push(nuevaPersona(i));
  let vi = 1;
  DB.per.forEach(p=>{
    const n = chance(.62) ? (chance(.22) ? 2 : 1) : 0;
    for(let k=0;k<n;k++){
      const v = nuevoVehiculo(vi++, p);
      if(chance(.14)) v.inc.push(pk(['Denuncia de tráfico pendiente de pago','Vehículo inmovilizado en 2024 por falta de seguro','Figura en base de datos de aparcamiento indebido reiterado']));
      DB.veh.push(v); p.veh.push(v.id);
    }
  });
  for(let i=0;i<40;i++){
    const t = pk(DB.per);
    DB.emp.push({id:'E'+pad(i+1,3), nom:`${pk(EMPRESA_A)} ${pk(EMPRESA_B)} S.L.`, cif:'B'+ri(10000000,99999999),
      admin:t.id, alta:{d:ri(1,28),m:ri(1,12),y:ri(2012,2025)}, mun:t.dom.mun, act:pk(['Transporte de mercancías','Construcción','Comercio al por mayor','Hostelería','Servicios inmobiliarios','Importación'])});
  }
  DB.per.forEach(p=>{
    const n = ri(0,3);
    for(let k=0;k<n;k++){
      const o = pk(DB.per);
      if(o.id===p.id) continue;
      const tipo = pk(['Familiar','Pareja/expareja','Conocido','Vecino','Socio mercantil','Antiguo compañero de trabajo']);
      p.vinc.push({id:o.id, tipo});
      if(!o.vinc.some(v=>v.id===p.id)) o.vinc.push({id:p.id, tipo});
    }
  });
  DB.per.forEach(p=>{ DB.byId[p.id]=p; DB.byDni[p.dni]=p; p.tel.forEach(t=>{ DB.byTel[t] = DB.byTel[t] || p; }); });
  DB.veh.forEach(v=>{ DB.byMat[v.mat] = v; DB.byId[v.id] = v; });
}
</script>
<script>
/* ══════════════════════════════════════════════════════════════
   GENERADOR DE CASOS
   ══════════════════════════════════════════════════════════════ */
const PUNTOS = ['A-4 pk 18 · dirección sur','N-340 pk 122','Ronda exterior · salida 7','Acceso al polígono industrial','Peaje AP-7 · barrera 3','Avenida de la Estación · cruce con Mayor','Túnel de la Ronda Norte','Rotonda del Puerto','Carretera comarcal CM-42 · pk 6','Entrada al centro comercial'];
const CASOS = [
 {tipo:'ROBO CON FUERZA', cod:'237',
  tit:'Robo en establecimiento de joyería',
  res:(c)=>`Sobre las ${c.horaTxt} horas del ${c.fechaTxt}, dos individuos acceden a la joyería situada en ${c.lugar}, en ${c.mun}, tras fracturar la persiana metálica con un útil tipo palanca. Sustraen piezas de oro y relojes valorados en ${eur(c.botin)}. Huyen en un turismo que aguardaba con el motor en marcha.`,
  botin:()=>Math.round(rr(38000,190000)),
  testigo:'Un vecino observa la huida desde un balcón. Describe a uno de los autores y aporta una matrícula parcial.'},
 {tipo:'ROBO CON VIOLENCIA', cod:'242',
  tit:'Atraco a furgón de recaudación',
  res:(c)=>`A las ${c.horaTxt} del ${c.fechaTxt}, dos encapuchados interceptan a un vigilante durante la recogida de recaudación en ${c.lugar} (${c.mun}). Le intimidan con un arma corta y sustraen ${eur(c.botin)} en efectivo. Abandonan el lugar en un vehículo que les esperaba en doble fila.`,
  botin:()=>Math.round(rr(60000,240000)),
  testigo:'El vigilante y un empleado del centro coinciden en la descripción de uno de los autores. Una cámara privada capta parcialmente la matrícula.'},
 {tipo:'SECUESTRO EXPRÉS', cod:'163',
  tit:'Detención ilegal con exigencia económica',
  res:(c)=>`El ${c.fechaTxt} a las ${c.horaTxt}, un empresario es introducido a la fuerza en un vehículo a la salida de su domicilio en ${c.lugar} (${c.mun}). Es liberado seis horas después tras una transferencia de ${eur(c.botin)}. Declara haber oído a los autores hablar entre ellos por teléfono.`,
  botin:()=>Math.round(rr(20000,90000)),
  testigo:'La víctima recuerda parte de la matrícula del vehículo y describe a quien conducía.'},
 {tipo:'TRÁFICO DE DROGAS', cod:'368',
  tit:'Distribución de sustancia estupefaciente',
  res:(c)=>`Una inspección en ${c.lugar} (${c.mun}) el ${c.fechaTxt} localiza ${ri(12,90)} kg de hachís ocultos en un doble fondo. El conductor huye a pie. El vehículo nodriza que le escoltaba es grabado por un lector de matrículas a las ${c.horaTxt}. Valor estimado de la sustancia: ${eur(c.botin)}.`,
  botin:()=>Math.round(rr(90000,400000)),
  testigo:'Un agente del dispositivo anota parcialmente la matrícula del vehículo lanzadera.'},
 {tipo:'ESTAFA AGRAVADA', cod:'248',
  tit:'Estafa mediante suplantación bancaria',
  res:(c)=>`Entre el ${c.fechaTxt} y el día siguiente, varias víctimas transfieren ${eur(c.botin)} a cuentas abiertas con documentación falsa tras recibir llamadas suplantando a su entidad. Un vehículo alquilado es captado en los cajeros donde se extrae el efectivo a las ${c.horaTxt}.`,
  botin:()=>Math.round(rr(40000,160000)),
  testigo:'Las cámaras del cajero graban a quien retira el dinero. Se obtiene una matrícula incompleta del vehículo utilizado.'}
];
const OBJETOS = {
 '237':['tres relojes de alta gama con los números de serie limados','una bolsa con piezas de oro sin punzonar','un útil tipo palanca con restos de pintura de la persiana'],
 '242':['fajos de billetes con precintos de la empresa de seguridad','dos pasamontañas y guantes de látex','un arma corta simulada'],
 '163':['bridas de plástico idénticas a las empleadas','un teléfono con tarjeta prepago activada ese mismo día','una capucha con restos biológicos'],
 '368':['una prensa hidráulica con restos de resina','útiles de vacío y logotipos de marcado','40.000 € en efectivo en el falso techo'],
 '248':['catorce tarjetas bancarias a nombre de terceros','un ordenador con plantillas de correo suplantando a la entidad','documentación de identidad falsificada']
};
function generarCaso(seed){
  RND = mulberry32(seed ^ 0x5f3a);
  const T = pk(CASOS);
  const mun = pk(MUN);
  const hoy = new Date();
  const c = {
    num: `${pad(ri(100,999),3)}/${hoy.getFullYear()}`,
    seed, tipo:T.tipo, cod:T.cod, tit:T.tit,
    mun: mun[0], prov: mun[1],
    lugar: `${pk(VIA)} ${pk(VIA_N)}, ${ri(2,90)}`,
    fecha: (()=>{ const dd = new Date(hoy.getTime() - ri(1,20)*86400000);
      return {d:dd.getDate(), m:dd.getMonth()+1, y:dd.getFullYear(), ts:dd.getTime()}; })(),
    horaMin: ri(1,6)*60 + ri(0,59)
  };
  c.fechaTxt = fmtF(c.fecha);
  c.horaTxt = fmtH(c.horaMin);
  c.botin = T.botin();
  c.testigo = T.testigo;
  /* ── reparto ── */
  const enEdad = p => p.fnac.edad >= 21 && p.fnac.edad <= 56;
  const candidatos = DB.per.filter(p=>p.ant.length>=1 && p.veh.length>=1 && enEdad(p));
  const conductor = pk(candidatos.length?candidatos:DB.per.filter(enEdad));
  let autor = null;
  const pool = conductor.vinc.map(v=>DB.byId[v.id]).filter(Boolean).filter(enEdad);
  autor = pool.find(p=>p.ant.length>=2) || pk(DB.per.filter(p=>p.ant.length>=2 && p.id!==conductor.id && enEdad(p)));
  if(!conductor.vinc.some(v=>v.id===autor.id)){
    conductor.vinc.push({id:autor.id, tipo:pk(['Conocido','Socio mercantil','Antiguo compañero de trabajo'])});
    autor.vinc.push({id:conductor.id, tipo:'Conocido'});
  }
  c.conductor = conductor.id;
  c.autor = autor.id;
  /* ── vehículo de la huida y matrícula parcial ── */
  const veh = DB.byId[conductor.veh[0]] || pk(DB.veh);
  c.veh = veh.id; c.mat = veh.mat;
  const m = veh.mat.replace(' ','');
  c.matParcial = `${m[0]}${m[1]}?? ${m[4]}?${m[6]}`;
  c.matRegex = new RegExp(`^${m[0]}${m[1]}..${m[4]}.${m[6]}$`);
  /* ── descripción del testigo: apunta al AUTOR, no al conductor ── */
  if(autor.senas.includes('sin señas particulares')){
    const pp = autor.senas.split(' · ');
    autor.senas = `${pp[0]} · ${pp[1]} · ${pk(RASGOS.filter(r=>r!=='sin señas particulares'))}`;
  }
  const SE = autor.senas.split(' · ');
  c.altura = SE[0]; c.compl = SE[1]; c.rasgo = SE[2];
  const e0 = autor.fnac.edad;
  c.descripcion = `${autor.sexo==='H'?'Varón':'Mujer'}, entre ${Math.max(18,e0-3)} y ${e0+3} años. ${SE[1].charAt(0).toUpperCase()+SE[1].slice(1)}, en torno a ${SE[0]}. Rasgo observado: ${SE[2]}.`;
  const cerca = DB.per.filter(x=>x.id!==autor.id && x.id!==conductor.id && Math.abs(x.fnac.edad-e0)<=6);
  pkn(cerca, 2).forEach(d=>{
    d.senas = `${SE[0]} · ${SE[1]} · ${pk(RASGOS.filter(r=>r!==SE[2] && r!=='sin señas particulares'))}`;
    if(!conductor.vinc.some(v=>v.id===d.id)){
      conductor.vinc.push({id:d.id, tipo:pk(['Conocido','Vecino','Antiguo compañero de trabajo'])});
      d.vinc.push({id:conductor.id, tipo:'Conocido'});
    }
  });
  /* ── lecturas del lector de matrículas ── */
  c.punto = pk(PUNTOS);
  c.lecturas = [];
  const base = c.horaMin;
  for(let i=0;i<26;i++){
    const v = pk(DB.veh);
    c.lecturas.push({mat:v.mat, min: base + ri(-140, 140), punto: pk(PUNTOS), vel: ri(38,128)});
  }
  c.lecturas.push({mat:veh.mat, min: base + ri(3, 16), punto: c.punto, vel: ri(96,151), clave:true});
  c.lecturas.push({mat:veh.mat, min: base - ri(24, 70), punto: c.punto, vel: ri(42,70), clave:true});
  c.lecturas.sort((a,b)=>a.min-b.min);
  /* ── telefonía ── */
  c.telAutor = autor.tel[0];
  c.telConductor = conductor.tel[0];
  c.llamadas = [];
  const cell = ()=>`Celda ${pad(ri(1,90),2)}${pk('ABC')} · ${pk([c.mun, pk(MUN)[0]])}`;
  for(let i=0;i<16;i++){
    const otro = pk(DB.per);
    c.llamadas.push({a:c.telConductor, b:otro.tel[0], min: base + ri(-900, 900), dur: ri(12, 420), celda: cell()});
  }
  [-38, -12, 9, 41].forEach(off=>{
    c.llamadas.push({a:c.telConductor, b:c.telAutor, min: base + off, dur: ri(18, 96),
      celda:`Celda ${pad(ri(1,90),2)}${pk('ABC')} · ${c.mun} · sector ${pk('NSEO')}`, clave:true});
  });
  c.llamadas.sort((a,b)=>a.min-b.min);
  /* ── rastro económico ── */
  c.iban = autor.cuenta.iban;
  c.movs = [];
  for(let i=0;i<9;i++){
    c.movs.push({fecha:sumaDias(c.fecha, -ri(1,20)),
      con:pk(['Nómina','Recibo suministro eléctrico','Compra TPV supermercado','Cuota préstamo','Transferencia recibida particular','Bizum emitido','Retirada cajero','Recibo seguro']),
      imp: Math.round(rr(-900, 2100))});
  }
  const dImp = Math.round(c.botin * rr(.18, .38));
  c.movs.push({fecha:sumaDias(c.fecha, 1),
    con:`Ingreso en efectivo en ventanilla · oficina de ${c.mun}`, imp: dImp, clave:true});
  c.movs.push({fecha:sumaDias(c.fecha, 2),
    con:`Transferencia emitida a ${nombreCompleto(DB.byId[c.conductor])}`, imp: -Math.round(dImp*rr(.3,.5)), clave:true});
  c.movs.sort((a,b)=>(a.fecha.ts||0)-(b.fecha.ts||0));
  /* ── distractores: mismo patrón de matrícula ── */
  c.senuelos = DB.veh.filter(v=>v.mat!==veh.mat && c.matRegex.test(v.mat.replace(' ',''))).slice(0,5).map(v=>v.id);
  while(c.senuelos.length < 3){
    const v = pk(DB.veh);
    if(v.id!==veh.id && !c.senuelos.includes(v.id)){
      const mm = v.mat.replace(' ','');
      v.mat = `${m[0]}${m[1]}${mm[2]}${mm[3]} ${m[4]}${mm[5]}${m[6]}`;
      DB.byMat[v.mat] = v;
      c.senuelos.push(v.id);
    }
  }
  /* los señuelos también pasan por el punto: obligan a mirar la hora */
  c.senuelos.forEach(id=>{
    const sv = DB.byId[id];
    if(!sv) return;
    c.lecturas.push({mat:sv.mat, min: base + (chance(.5) ? -ri(45,135) : ri(55,140)), punto:c.punto, vel:ri(40,95)});
    if(chance(.5)) c.lecturas.push({mat:sv.mat, min: base + ri(-160,160), punto: pk(PUNTOS), vel:ri(40,110)});
  });
  c.lecturas.sort((a,b)=>a.min-b.min);
  c.objetos = OBJETOS[c.cod];
  return c;
}

/* ══════════════════════════════════════════════════════════════
   ESTADO DE LA PARTIDA
   ══════════════════════════════════════════════════════════════ */
const COSTE = {persona:45, vehiculo:30, lector:120, telefonia:240, banco:200, registro:480, vigilancia:600, pista:120, busqueda:30, detencion:120, empresa:60, auto:150};
const PLAZO = 48*60;
let G = null;
function nuevaPartida(seed, agentes, modo){
  generarMundo(seed);
  const caso = generarCaso(seed);
  G = {
    seed, caso, modo, agentes,
    reloj: 0, plazo: PLAZO,
    pruebas: {}, hallazgos: [], log: [],
    aut: {tel:false, banco:false, registro:false},
    vistos: {}, marcados: {}, fin: null, pistasUsadas: 0,
    acusacion: [null, null], turno: 0
  };
  hallazgo('Atestado inicial recibido. Se asume la investigación.', 'doc');
  return G;
}
function hallazgo(txt, tipo){
  if(G.hallazgos.some(h=>h.txt===txt)) return;
  G.hallazgos.unshift({txt, tipo:tipo||'nota', min:G.reloj});
}
function gastar(min, etiqueta){
  G.reloj += min;
  G.log.push({min, etiqueta, t:G.reloj});
  if(G.reloj >= G.plazo && !G.fin) finPorPlazo();
  return G.reloj < G.plazo;
}
function prueba(id, txt){
  if(G.pruebas[id]) return false;
  G.pruebas[id] = {txt, min:G.reloj};
  hallazgo('PRUEBA OBTENIDA · ' + txt, 'prueba');
  return true;
}
function nPruebas(){ return Object.keys(G.pruebas).length; }
function restante(){ return Math.max(0, G.plazo - G.reloj); }
function relojTxt(){
  const h = Math.floor(G.reloj/60), m = G.reloj%60;
  return `${pad(h)}:${pad(m)}`;
}
function restanteTxt(){
  const r = restante(), h = Math.floor(r/60), m = r%60;
  return `${pad(h)} h ${pad(m)} min`;
}
</script>

const $ = s => document.querySelector(s);
const term = $('#term'), clas = $('#clas'), head = $('#head'), view = $('#view'), bar = $('#bar'), lockEl = $('#lock');
const ACT = {};
let TM = [];
function clearTM(){ TM.forEach(t=>{clearTimeout(t);clearInterval(t);}); TM = []; }

const FS = {
  wl:null,
  activo(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  posible(){ const e = document.documentElement; return !!(e.requestFullscreen || e.webkitRequestFullscreen); },
  async wake(){
    try{ if('wakeLock' in navigator && !this.wl) this.wl = await navigator.wakeLock.request('screen'); }catch(e){}
  },
  async toggle(){
    const e = document.documentElement;
    try{
      if(this.activo()){
        const salir = document.exitFullscreen || document.webkitExitFullscreen;
        if(salir) await salir.call(document);
        if(this.wl){ try{ this.wl.release(); }catch(x){} this.wl = null; }
        return true;
      }
      const pedir = e.requestFullscreen || e.webkitRequestFullscreen;
      if(!pedir) return false;
      await pedir.call(e, {navigationUI:'hide'});
      this.wake();
      return true;
    }catch(err){ return false; }
  }
};

const AU = {ctx:null, on:true, vib:true,
  init(){ if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
          if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  t(f,d,ty,v,sl,de){ if(!this.on||!this.ctx) return;
    const tt = this.ctx.currentTime + (de||0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = ty||'square'; o.frequency.setValueAtTime(f,tt);
    if(sl) o.frequency.exponentialRampToValueAtTime(Math.max(40,f*sl), tt+d);
    g.gain.setValueAtTime(0,tt); g.gain.linearRampToValueAtTime(v||.08, tt+.008);
    g.gain.exponentialRampToValueAtTime(.0001, tt+d);
    o.connect(g); g.connect(this.ctx.destination); o.start(tt); o.stop(tt+d+.04);
  },
  vibrate(p){ if(this.vib && navigator.vibrate) try{navigator.vibrate(p);}catch(e){} }
};
const SFX = {
  key(){ AU.t(1650,.03,'square',.045); },
  ok(){ AU.t(880,.07,'square',.07); AU.t(1320,.09,'square',.06,1,.06); AU.vibrate(12); },
  hit(){ AU.t(660,.06,'square',.07); AU.t(990,.08,'triangle',.07,1,.05); AU.t(1480,.12,'triangle',.06,1,.11); AU.vibrate([14,30,14]); },
  err(){ AU.t(180,.22,'sawtooth',.09,.6); AU.vibrate([40,50,40]); },
  print(){ for(let i=0;i<7;i++) AU.t(420+ i*40,.03,'square',.035,1,i*.045); },
  alarm(){ [660,520,660,520].forEach((f,i)=>AU.t(f,.16,'square',.09,1,i*.18)); AU.vibrate([60,40,60,40,60]); },
  win(){ [523,659,784,1047].forEach((f,i)=>AU.t(f,.28,'triangle',.10,1,i*.11)); AU.vibrate([60,40,120]); },
  lose(){ [392,311,247].forEach((f,i)=>AU.t(f,.4,'sine',.10,1,i*.16)); AU.vibrate([100,60,160]); }
};

  const res = DB.per.filter(p=>{

        <p class="sm" style="margin-top:6px">Ninguna matrícula encaja con ese patrón.</p></div>`) : ''}
  </div>`,
  bar:`<button class="btn gh" data-a="home">VOLVER AL TERMINAL</button>`});

function patronMat(q){
  const t = q.toUpperCase().replace(/[\s-]/g,'');
  const rx = new RegExp('^' + t.split('').map(ch=> ch==='?'||ch==='*' ? '.' : ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('') + '$');
  return {rx, plano:t};
}
function buscarVehiculos(q){
  if(!gastar(COSTE.vehiculo, 'Consulta de matrícula: ' + q)) return null;
  const {rx, plano} = patronMat(q);
  return DB.veh.filter(v=>{
    const m = v.mat.replace(' ','');
    return rx.test(m) || (plano.length>=3 && !plano.includes('?') && m.includes(plano));
  });
}

  const q = ($('#qv').value||'').trim();

  if(q.replace(/[\s?]/g,'').length < 2){ msg('Introduce al menos dos caracteres conocidos'); return; }
  const res = buscarVehiculos(q);
  if(res === null) return scrFinal();
  SFX.ok();
  scrVehiculos(res);
};
ACT.buscarVehAt = () => {

};

      <div class="f"><b>Seguro</b><span>${v.seguro?esc(v.seguro):'<span class="r">SIN SEGURO EN VIGOR</span>'}</span></div>

let lectPunto = null, lectCruce = false;
function scrLector(){
  const c = G.caso;
  paint({view:`<div class="col fade">
    <h2 class="g">LECTORES DE MATRÍCULA</h2>

ACT.verLect = t => {
  const p = PUNTOS[+t.dataset.i];
  if(!gastar(COSTE.lector, 'Volcado de lector: ' + p)) return scrFinal();
  lectPunto = p; lectCruce = false;
  SFX.print();
  pintarLect();
};
ACT.cruzar = () => { lectCruce = !lectCruce; SFX.ok(); pintarLect(); };
function pintarLect(){
  const c = G.caso;
  let filas = c.lecturas.filter(l=>l.punto === lectPunto);
  const hayClave = filas.some(l=>l.clave);
  if(hayClave && !G.vistoLectura){
    G.vistoLectura = true;
    hallazgo(`Lector de ${lectPunto}: un vehículo pasa a ${filas.filter(l=>l.clave).map(l=>fmtH(l.min)).join(' y ')} h.`, 'clave');
    const v = DB.byMat[c.mat];
    if(G.vistos[v.id]) prueba('veh', `El ${v.marca} ${v.modelo} matrícula ${v.mat} fue captado por el lector de ${c.punto} minutos después de los hechos.`);
  }
  const {rx} = patronMat(c.matParcial);
  if(lectCruce) filas = filas.filter(l=>rx.test(l.mat.replace(' ','')));
  paint({view:`<div class="col fade">
    <div class="row sb"><h2 class="g">VOLCADO DE LECTOR</h2><span class="tag">${filas.length} PASOS</span></div>
    <div class="box"><div class="k g">PUNTO</div><div class="cap">${esc(lectPunto)}</div>
      <div class="xs">Franja ${fmtH(c.horaMin-140)} – ${fmtH(c.horaMin+140)} del ${c.fechaTxt}</div></div>
    <button class="btn ${lectCruce?'pri':''}" data-a="cruzar">
      ${lectCruce?'✔ CRUZADO CON '+c.matParcial:'CRUZAR CON LA MATRÍCULA DEL ATESTADO'}
      <span class="s">${lectCruce?'quitar filtro':'filtra los que encajan'}</span></button>
    <div class="box" style="padding:8px">
      <div class="scrollx"><table class="tbl">
        <tr><th>Hora</th><th>Matrícula</th><th>Vel.</th><th></th></tr>
        ${filas.length?filas.map(l=>{
          const v = DB.byMat[l.mat];
          const enc = rx.test(l.mat.replace(' ',''));
          return `<tr class="${enc?'hot':''}">
            <td class="mono">${fmtH(l.min)}</td>
            <td class="mono ${enc?'a':''}">${l.mat}</td>
            <td class="mono dim2">${l.vel}</td>
            <td>${v?`<button class="btn sm" style="min-height:28px;padding:2px 6px" data-a="veh" data-i="${v.id}">VER</button>`:''}</td></tr>`;
        }).join(''):'<tr><td colspan="4" class="dim">Sin pasos en esa franja.</td></tr>'}
      </table></div>
    </div>
    ${lectCruce?'<div class="box hi"><div class="k a">FILTRO ACTIVO</div><p class="sm" style="margin-top:4px">Solo se muestran las matrículas que encajan con el patrón del testigo. Abre cada una y mira quién es el titular.</p></div>':''}
  </div>`,
  bar:`<div class="g2"><button class="btn gh" data-a="mod" data-m="lector">OTRO PUNTO</button>
    <button class="btn gh" data-a="home">TERMINAL</button></div>`});
}

ACT.lldDe = t => volcarLLD(DB.byId[t.dataset.i]);
function volcarLLD(p){
  const c = G.caso;
  if(!gastar(COSTE.telefonia, 'Volcado de tráfico: ' + nombreCompleto(p))) return scrFinal();
  const esCaso = p.id === c.conductor || p.id === c.autor;
  const num = p.tel[0];
  let filas;
  if(esCaso){
    filas = c.llamadas.filter(l=>l.a===num || l.b===num);
    const otro = p.id === c.conductor ? DB.byId[c.autor] : DB.byId[c.conductor];
    if(filas.some(l=>l.clave)){
      hallazgo(`Tráfico de llamadas: ${nombreCompleto(p)} contacta cuatro veces con ${nombreCompleto(otro)} alrededor de la hora de los hechos.`, 'clave');
      prueba('tel', `Cuatro comunicaciones entre ${nombreCompleto(DB.byId[c.conductor])} y ${nombreCompleto(DB.byId[c.autor])} entre las ${fmtH(c.horaMin-38)} y las ${fmtH(c.horaMin+41)} h, con celdas en ${c.mun}.`);
    }
  } else {
    RND = mulberry32(parseInt(num.slice(-6),10));
    filas = [];
    for(let i=0;i<12;i++){
      const o = pk(DB.per);
      filas.push({a:num, b:o.tel[0], min:c.horaMin + ri(-900,900), dur:ri(10,400), celda:`Celda ${pad(ri(1,90),2)}${pk('ABC')} · ${o.dom.mun}`});
    }
    filas.sort((a,b)=>a.min-b.min);
  }
  SFX.print();
  paint({view:`<div class="col fade">
    <div class="row sb"><h2 class="g">TRÁFICO DE LLAMADAS</h2><span class="tag">${filas.length}</span></div>
    <div class="box"><div class="k g">ABONADO</div>
      <div class="cap" style="font-size:16px">${esc(nombreCompleto(p))}</div>
      <div class="mono xs">${p.tel.join(' · ')}</div></div>
    <div class="box" style="padding:8px">
      <div class="scrollx"><table class="tbl">
        <tr><th>Hora</th><th>Interlocutor</th><th>Dur.</th><th>Celda</th></tr>
        ${filas.map(l=>{
          const otroNum = l.a===num ? l.b : l.a;
          const o = DB.byTel[otroNum];
          return `<tr class="${l.clave?'hot':''}">
            <td class="mono">${fmtH(l.min)}</td>
            <td class="mono ${l.clave?'a':''}">${otroNum}${o?`<br><span class="dim2" style="font-size:10px">${esc(o.ape1)}, ${esc(o.nombre)}</span>`:''}</td>
            <td class="mono dim2">${l.dur}s</td>
            <td class="dim2" style="font-size:10px">${esc(l.celda)}</td></tr>`;
        }).join('')}
      </table></div>
    </div>
    ${esCaso?'<div class="box hi"><div class="k a">LO SUBRAYADO</div><p class="sm" style="margin-top:4px">Las líneas resaltadas caen dentro de la franja del delito. Ese patrón de llamadas cortas y seguidas es material de informe.</p></div>':'<div class="box"><div class="k">SIN RELEVANCIA APARENTE</div><p class="sm" style="margin-top:4px">Nada en este tráfico se relaciona con los hechos.</p></div>'}
  </div>`, bar:`<button class="btn gh" data-a="home">VOLVER AL TERMINAL</button>`});
}

  if(!G.vistos[v.id]) return `En el volcado, pulsa <b>CRUZAR CON LA MATRÍCULA DEL ATESTADO</b>. Quedarán varias que encajan: quédate con la que pasa <b>justo después de las ${G.caso.horaTxt}</b>, que es cuando huyeron. Ábrela.`;
  if(!G.vistos[cond.id]) return `Ya tienes el coche. Abre la <b>ficha del titular</b> desde la propia ficha del vehículo.`;
  if(!G.vistos[aut.id]) return `El titular conducía, pero el testigo describe a otra persona. Baja a <b>VÍNCULOS CONOCIDOS</b> en su ficha y abre uno por uno, comparando las <b>señas</b> con la descripción del testigo.`;
  if(!G.marcados[aut.id]) return `Uno de esos vinculados encaja con la descripción del testigo. <b>Márcalo como sospechoso</b> en su ficha.`;
  if(!G.aut.tel) return `Con esos indicios el juez ya te firma. Pide la <b>intervención de comunicaciones</b> en AUTORIZACIONES.`;
  if(!G.pruebas.tel) return `Vuelca el <b>tráfico de llamadas</b> del titular del vehículo o del sospechoso y mira la franja del delito.`;
  if(!G.aut.banco) return `Pide la <b>investigación patrimonial</b> en AUTORIZACIONES: ya tienes indicios de sobra.`;
  if(!G.pruebas.din) return `Requiere la <b>cuenta del sospechoso</b> y busca el movimiento raro justo después de los hechos.`;
  if(nPruebas() < 3) return `Te falta una prueba. Prueba con una <b>vigilancia</b> sobre el sospechoso o con el <b>registro domiciliario</b> si el juez ya lo autorizó.`;

};
ACT.vigilar = t => {
  const p = DB.byId[t.dataset.i], c = G.caso;
  if(!gastar(COSTE.vigilancia, 'Vigilancia sobre ' + nombreCompleto(p))) return scrFinal();
  let txt, ok = false;
  if(p.id === c.autor){
    ok = true;
    txt = `Se le observa acudir a un trastero en las afueras de ${esc(c.mun)} y salir con una bolsa de deporte. Se reúne quince minutos con ${esc(nombreCompleto(DB.byId[c.conductor]))} en un aparcamiento y se separan sin despedirse.`;
    prueba('vig', `Vigilancia: ${nombreCompleto(p)} accede a un trastero y se reúne con el titular del vehículo de la huida, con actitud de contravigilancia.`);
  } else if(p.id === c.conductor){
    txt = `Rutina normal salvo una reunión breve, en un aparcamiento, con un varón que no baja del coche. No se identifica al acompañante.`;
    hallazgo(`Vigilancia sobre ${nombreCompleto(p)}: se reúne con alguien no identificado.`, 'nota');
  } else {
    txt = `Cuatro horas de seguimiento sin nada reseñable. Domicilio, trabajo, domicilio.`;
  }
  SFX[ok?'hit':'ok']();
  paint({view:`<div class="col fade">
    <div class="doc"><div class="k">ACTA DE VIGILANCIA</div>
      <h3 style="margin-top:4px">${esc(nombreCompleto(p))}</h3>
      <div class="sep"></div><p style="margin:0">${txt}</p>
      <div class="sep"></div><p style="margin:0;font-size:12px">Duración del dispositivo: 4 horas.</p></div>
  </div>`, bar:`<button class="btn pri" data-a="home">VOLVER AL TERMINAL</button>`});
};
ACT.registrar = t => {
  const p = DB.byId[t.dataset.i], c = G.caso;
  if(!gastar(COSTE.registro, 'Entrada y registro en domicilio de ' + nombreCompleto(p))) return scrFinal();
  const acierto = p.id === c.autor || p.id === c.conductor;
  if(acierto){
    prueba('obj', `En el registro del domicilio de ${nombreCompleto(p)} se ocupan ${c.objetos[0]}.`);
    SFX.hit();
  } else { SFX.err(); G.registroFallido = (G.registroFallido||0)+1; }
  paint({view:`<div class="col fade">
    <div class="doc"><div class="stamp">${acierto?'EFECTOS':'NEGATIVO'}</div>
      <div class="k">ACTA DE ENTRADA Y REGISTRO</div>
      <h3 style="margin-top:4px">${esc(domTexto(p))}</h3>
      <div class="sep"></div>
      ${acierto
        ? `<p style="margin:0">Practicado el registro en presencia del letrado de la Administración de Justicia, se ocupan:</p>
           <ul style="margin:8px 0 0;padding-left:18px">${c.objetos.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`
        : `<p style="margin:0">Practicado el registro, <b>no se localizan efectos</b> relacionados con los hechos.
           El titular presenta queja. El instructor no está contento.</p>`}
    </div>
  </div>`, bar:`<button class="btn pri" data-a="home">VOLVER AL TERMINAL</button>`});
};
ACT.detener = t => {
  const p = DB.byId[t.dataset.i], c = G.caso;
  if(!gastar(COSTE.detencion, 'Solicitud de detención de ' + nombreCompleto(p))) return scrFinal();
  if(p.id === c.autor && nPruebas() >= 3){ G.detenido = p.id; return terminar('resuelto'); }
  if(p.id === c.autor){
    SFX.err();
    return paint({view:`<div class="col fade">
      <div class="box cr"><div class="k r">EL JUZGADO NO AUTORIZA</div>
        <p class="sm" style="margin-top:6px">La solicitud decae: solo aportas <b>${nPruebas()} prueba${nPruebas()===1?'':'s'}</b> de las tres exigidas.
        Sigues teniendo la persona correcta, pero necesitas sostenerla.</p>
        <p class="xs" style="margin-top:8px">Has perdido una hora. El plazo sigue corriendo.</p></div>
    </div>`, bar:`<button class="btn pri" data-a="home">SEGUIR TRABAJANDO</button>`});
  }
  if(p.id === c.conductor && nPruebas() >= 2){
    G.confeso = true;
    gastar(180, 'Declaración del detenido');
    hallazgo(`${nombreCompleto(p)} declara: conducía, pero el que entró fue otro. Aporta un nombre.`, 'clave');
    SFX.alarm();
    return paint({view:`<div class="col fade">
      <div class="box al"><div class="k a">DECLARACIÓN EN DEPENDENCIAS</div>
        <p class="sm" style="margin-top:6px">${esc(nombreCompleto(p))} reconoce que <b>solo conducía</b>. Señala como autor material a
        alguien de su entorno y se acoge a su derecho a no declarar más.</p>
        <p class="sm" style="margin-top:8px">Has quemado <b>4 horas</b> y la detención del conductor no cierra el caso:
        el instructor quiere al que entró.</p></div>
    </div>`, bar:`<button class="btn pri" data-a="home">VOLVER AL TERMINAL</button>`});
  }
  G.errorGrave = (G.errorGrave||0) + 1;
  gastar(240, 'Puesta en libertad tras detención errónea');
  SFX.lose();
  paint({view:`<div class="col fade">
    <div class="box cr"><div class="k r">DETENCIÓN ERRÓNEA</div>
      <p class="sm" style="margin-top:6px">${esc(nombreCompleto(p))} acredita dónde estaba. Queda en libertad sin cargos
      y presenta queja. El instructor te lo va a recordar durante años.</p>
      <p class="xs" style="margin-top:8px">−4 horas de plazo. El autor sigue ahí fuera.</p></div>
  </div>`, bar:`<button class="btn pri" data-a="home">VOLVER AL TERMINAL</button>`});
};

/* ── ACUSACIÓN FINAL (MODO DÚO) ── */
function candidatos(){
  const ids = new Set(Object.keys(G.marcados));
  Object.keys(G.vistos).forEach(id=>{ if(DB.byId[id] && DB.byId[id].dni) ids.add(id); });
  return [...ids].map(id=>DB.byId[id]).filter(Boolean).slice(0, 24);
}
ACT.acusar = () => {
  const c = candidatos();
  if(c.length < 2){ msg('Antes tenéis que consultar fichas de gente'); return; }
  G.acusacion = [null, null];
  pedirAcusacion(0);
};
function pedirAcusacion(i){
  traspaso(G.agentes[i], 'Firma tu acusación. El otro agente no debe verla.', ()=>{
    paint({view:`<div class="col fade">
      <div class="box hi"><div class="k a">ACUSACIÓN DE ${esc(G.agentes[i])}</div>
        <p class="sm" style="margin-top:5px">¿Quién entró? Solo una firma, y no se puede cambiar.</p>
        <p class="xs" style="margin-top:5px">Descripción del testigo: ${esc(G.caso.descripcion)}</p></div>
      <div class="col" style="gap:6px">
        ${candidatos().map(p=>`<button class="hit" data-a="firmar" data-i="${p.id}" data-j="${i}">
          <span class="av">${p.foto}</span><span style="flex:1"><span class="nm">${esc(nombreCompleto(p))}</span>
          <span class="sub">${esc(p.senas)}</span></span>
          ${G.marcados[p.id]?'<span class="tag g">MARCADO</span>':''}</button>`).join('')}
      </div>
    </div>`, bar:''});
  });
}
ACT.firmar = t => {
  const j = +t.dataset.j;
  G.acusacion[j] = t.dataset.i;
  SFX.hit();
  if(j === 0) pedirAcusacion(1);
  else { gastar(COSTE.detencion, 'Acusaciones firmadas'); terminar('acusacion'); }
};
function finPorPlazo(){ if(!G.fin) G.fin = 'plazo'; }
function terminar(modo){
  G.fin = modo;
  const c = G.caso;
  const m = metaGet();
  m.casos = (m.casos||0)+1;
  const ok = modo === 'resuelto' || (modo === 'acusacion' && G.acusacion.includes(c.autor));
  if(ok){ m.res = (m.res||0)+1; m.mejor = Math.min(m.mejor||99999, G.reloj); }
  metaSet(m);
  scrFinal();
}
</script>
<script>
/* ── CIERRE DEL CASO ── */
function scrFinal(){
  const c = G.caso, autor = DB.byId[c.autor], cond = DB.byId[c.conductor];
  const modo = G.fin || 'plazo';
  const acierto = modo === 'resuelto' || (modo === 'acusacion' && G.acusacion.includes(c.autor));
  const horasRest = Math.floor(restante()/60);
  const pts = Math.max(0,
      (acierto ? 400 : 0) + nPruebas()*120 + horasRest*4
      - (G.errorGrave||0)*150 - (G.registroFallido||0)*80 - G.pistasUsadas*40);
  let cabecera;
  if(modo === 'resuelto'){
    cabecera = `<div style="text-align:center"><div style="font-size:52px">⚖️</div>
      <h1 class="g">CASO RESUELTO</h1>
      <p class="sm dim">Detenido el autor material con tres pruebas en el expediente.</p></div>`;
    SFX.win();
  } else if(modo === 'plazo'){
    cabecera = `<div style="text-align:center"><div style="font-size:52px">⏱️</div>
      <h1 class="r">PLAZO AGOTADO</h1>
      <p class="sm dim">48 horas. El operativo decae y el autor se pierde de vista.</p></div>`;
    SFX.lose();
  } else {
    cabecera = `<div style="text-align:center"><div style="font-size:52px">✒️</div>
      <h1 class="${acierto?'g':'a'}">SOBRES ABIERTOS</h1>
      <p class="sm dim">Las dos acusaciones, contra la realidad.</p></div>`;
    acierto ? SFX.win() : SFX.lose();
  }
  const duo = modo === 'acusacion' ? `<div class="box hi">
      <div class="k g">LAS FIRMAS</div>
      ${[0,1].map(i=>{
        const p = DB.byId[G.acusacion[i]];
        const bien = G.acusacion[i] === c.autor;
        return `<div class="row sb" style="padding:7px 0;border-bottom:1px solid var(--line)">
          <div><div class="cap" style="font-size:15px">${esc(G.agentes[i])}</div>
            <div class="xs">acusó a ${p?esc(nombreCompleto(p)):'nadie'}</div></div>
          <span class="tag ${bien?'g':'r'}">${bien?'ACERTÓ':'FALLÓ'}</span></div>`;
      }).join('')}
      <div class="sm" style="margin-top:8px">${
        G.acusacion[0]===c.autor && G.acusacion[1]===c.autor ? 'Los dos lo vieron. Empate honroso.' :
        G.acusacion.includes(c.autor) ? `<b class="g">${esc(G.agentes[G.acusacion[0]===c.autor?0:1])}</b> se lo lleva. El otro tendrá que aguantarlo.` :
        'Ninguno de los dos acertó. El instructor no quiere ni miraros.'}</div>
      ${G.datos?`<div class="xs" style="margin-top:8px">El dato reservado bueno lo tenía <b>${esc(G.agentes[G.datoFiable])}</b>.</div>`:''}
    </div>` : '';
  paint({view:`<div class="col fade">
    ${cabecera}
    <div class="box hi">
      <div class="k g">LO QUE PASÓ DE VERDAD</div>
      <div class="row" style="gap:10px;margin-top:8px">
        <div style="font-size:34px">${autor.foto}</div>
        <div style="flex:1"><div class="cap" style="font-size:16px">${esc(nombreCompleto(autor))}</div>
          <div class="xs">AUTOR MATERIAL · ${autor.dni} · ${autor.ant.length} antecedentes</div>
          <div class="xs a">${esc(autor.senas)}</div></div>
      </div>
      <div class="row" style="gap:10px;margin-top:10px">
        <div style="font-size:34px">${cond.foto}</div>
        <div style="flex:1"><div class="cap" style="font-size:16px">${esc(nombreCompleto(cond))}</div>
          <div class="xs">CONDUCTOR · titular del ${c.mat}</div></div>
      </div>
      <div class="rule" style="margin:10px 0"></div>
      <p class="sm">${esc(c.descripcion)}</p>
      <p class="xs" style="margin-top:6px">Estaba en la base de datos desde el minuto uno. Solo había que llegar.</p>
    </div>
    ${duo}
    <div class="box">
      <div class="k g">BALANCE</div>
      <div class="f"><b>Pruebas</b><span>${nPruebas()} de 3</span></div>
      <div class="f"><b>Tiempo empleado</b><span>${Math.floor(G.reloj/60)} h ${G.reloj%60} min</span></div>
      <div class="f"><b>Consultas</b><span>${G.log.length}</span></div>
      <div class="f"><b>Orientaciones pedidas</b><span>${G.pistasUsadas}</span></div>
      ${G.errorGrave?`<div class="f"><b class="r">Detenciones erróneas</b><span class="r">${G.errorGrave}</span></div>`:''}
      ${G.registroFallido?`<div class="f"><b class="r">Registros en balde</b><span class="r">${G.registroFallido}</span></div>`:''}
      <div class="f" style="border:0"><b>Puntuación</b><span class="mono g" style="font-size:18px">${pts}</span></div>
    </div>
    ${nPruebas()?`<div class="box"><div class="k g">PRUEBAS QUE LLEGASTE A REUNIR</div>
      ${Object.keys(G.pruebas).map(k=>`<p class="sm" style="margin:7px 0 0">✔ ${esc(G.pruebas[k].txt)}</p>`).join('')}</div>`:''}
  </div>`,
  bar:`<button class="btn pri" data-a="otroCaso">OTRO CASO</button>
    <button class="btn gh" data-a="menu">SALIR AL MENÚ</button>`});
}
ACT.otroCaso = () => {
  const ag = G.agentes.slice();
  const seed = Math.floor(Math.random()*2000000000);
  nuevaPartida(seed, ag, ag[1] ? 'duelo' : 'solo');
  SFX.print();
  scrBrief();
};

/* ── arranque ── */
scrBoot();
</script>
