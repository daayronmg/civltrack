<style>
/* ── SUBASTA TITANS ─ sala de subastas nocturna: laca oxblood, latón, cobalto ── */
:root{
  --ink:#0B0609; --ink2:#120A0F; --panel:#1A0F15; --panel2:#23151D; --panel3:#2C1B24;
  --line:#3A2531; --line2:#553645;
  --brass:#C9A227; --brass-hi:#F2DA92; --brass-dim:#7E661B;
  --ivory:#F4EADA; --mute:#A28D93; --mute2:#6B565E;
  --p1:#D9534B; --p1-deep:#4A1512; --p1-hi:#FF8A80;
  --p2:#5C86D6; --p2-deep:#132546; --p2-hi:#9CBBFF;
  --up:#5FC79B; --down:#E08A3C; --danger:#E2564D;
  --r:14px;
  --f-disp:"Bodoni Moda",'Times New Roman',serif;
  --f-ui:"Archivo",system-ui,-apple-system,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--ink);color:var(--ivory);font-family:var(--f-ui);
  font-size:16px;line-height:1.45;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button,input{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:0;height:0}

/* ── carcasa ── */
#shell{
  position:relative;width:100%;max-width:480px;margin:0 auto;
  height:100vh;height:100dvh;max-height:100dvh;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  background:
    radial-gradient(120% 60% at 50% -10%, #2A1520 0%, rgba(42,21,32,0) 60%),
    radial-gradient(80% 40% at 50% 105%, #1C1018 0%, rgba(28,16,24,0) 70%),
    var(--ink);
  box-shadow:0 0 0 1px var(--line), 0 0 90px rgba(0,0,0,.9);
  overflow:hidden;
}
#topbar{
  grid-row:1;display:flex;align-items:center;gap:8px;padding:10px 12px 8px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(201,162,39,.10),rgba(201,162,39,0));
}
#topbar.hide{display:none}
#stage{grid-row:2;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 14px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#dock{
  grid-row:3;padding:10px 14px calc(12px + var(--safe-b));display:flex;flex-direction:column;gap:8px;
  max-height:52vh;overflow-y:auto;flex:0 0 auto
}
#dock:empty{display:none}

/* ── tipografía ── */
h1,h2,h3{margin:0;font-family:var(--f-disp);font-weight:700;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;line-height:1.05}
h2{font-size:23px;line-height:1.12}
h3{font-size:18px}
.lbl{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);font-weight:700}
.lbl.gold{color:var(--brass)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:-.02em}
.small{font-size:13px;color:var(--mute)}
.tiny{font-size:11.5px;color:var(--mute2);line-height:1.4}
.ital{font-family:var(--f-disp);font-style:italic}
.c1{color:var(--p1)}.c2{color:var(--p2)}.gold{color:var(--brass-hi)}
.up{color:var(--up)}.down{color:var(--down)}

/* ── paneles ── */
.panel{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel.gilt{border-color:var(--brass-dim);box-shadow:inset 0 1px 0 rgba(242,218,146,.18)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.row.sb{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--line2),transparent);margin:2px 0}

/* ── botones ── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:56px;padding:12px 16px;border-radius:12px;border:1px solid var(--line2);
  background:linear-gradient(180deg,var(--panel3),var(--panel));color:var(--ivory);
  font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;
  cursor:pointer;transition:transform .09s ease,filter .15s ease,opacity .15s;
}
.btn:active{transform:scale(.975);filter:brightness(1.15)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
.btn.pri{
  background:linear-gradient(180deg,#E9CE6E,#C9A227 55%,#9A7A18);
  color:#20150A;border-color:#F2DA92;text-shadow:0 1px 0 rgba(255,255,255,.25);
  box-shadow:0 6px 18px -8px rgba(201,162,39,.9);
}
.btn.p1{background:linear-gradient(180deg,#E4645B,#B23A33);border-color:#FF8A80;color:#2A0B09}
.btn.p2{background:linear-gradient(180deg,#6E95E2,#3B60AC);border-color:#9CBBFF;color:#08152E}
.btn.gh{background:transparent;border-color:var(--line2);color:var(--mute);min-height:48px;font-size:14px}
.btn.dgr{background:linear-gradient(180deg,#7E2A25,#521916);border-color:#B24A43}
.btn.sm{min-height:44px;font-size:13px;padding:8px 10px}
.btn.wide{grid-column:1/-1}
.btn .sub{display:block;font-size:10.5px;letter-spacing:.14em;opacity:.72;font-weight:600}
.btn-col{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15;text-align:center}

/* ── chips / medidores ── */
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line2);background:rgba(255,255,255,.03);
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap
}
.chip.gold{border-color:var(--brass-dim);color:var(--brass-hi);background:rgba(201,162,39,.10)}
.chip.risk{border-color:#7A3B2E;color:#F0A88F;background:rgba(224,138,60,.10)}
.chip.c1{border-color:var(--p1);color:var(--p1-hi);background:rgba(217,83,75,.12)}
.chip.c2{border-color:var(--p2);color:var(--p2-hi);background:rgba(92,134,214,.14)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.meter{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brass-dim),var(--brass-hi))}
.meter.blue i{background:linear-gradient(90deg,#2F4E86,var(--p2-hi))}

/* ── lote (lámina de catálogo) ── */
.plate{
  position:relative;border:1px solid var(--brass-dim);border-radius:var(--r);
  background:radial-gradient(70% 70% at 50% 32%, #3A2230 0%, #1A0F15 72%);
  padding:18px 14px 14px;text-align:center;overflow:hidden
}
.plate::before,.plate::after{
  content:"";position:absolute;width:16px;height:16px;border:1px solid var(--brass);opacity:.6
}
.plate::before{top:6px;left:6px;border-right:0;border-bottom:0}
.plate::after{bottom:6px;right:6px;border-left:0;border-top:0}
.plate .obj{
  font-size:74px;line-height:1;filter:drop-shadow(0 10px 22px rgba(0,0,0,.75));
  animation:float 5s ease-in-out infinite
}
.plate .lotno{font-family:var(--f-num);font-size:11px;letter-spacing:.3em;color:var(--brass);opacity:.85}
.plate h2{margin:6px 0 2px}
.spot{position:absolute;inset:-40% -10% auto;height:200px;background:radial-gradient(50% 60% at 50% 0%,rgba(242,218,146,.20),transparent 70%);pointer-events:none}

/* ── puja ── */
.bidbox{
  border:1px solid var(--brass-dim);border-radius:var(--r);padding:12px;text-align:center;
  background:linear-gradient(180deg,rgba(201,162,39,.10),rgba(201,162,39,.02))
}
.bidnum{font-family:var(--f-num);font-size:40px;font-weight:600;letter-spacing:-.03em;color:var(--brass-hi);line-height:1}
.bidnum.sm{font-size:30px}
.ladder{display:flex;flex-direction:column;gap:6px;max-height:168px;overflow-y:auto}
.bidrow{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.03);border-left:3px solid var(--line2);font-size:14px}
.bidrow.b1{border-left-color:var(--p1)}
.bidrow.b2{border-left-color:var(--p2)}
.bidrow.newest{animation:slam .35s cubic-bezier(.2,1.5,.4,1)}
input[type=range]{width:100%;accent-color:var(--brass);height:34px}

/* ── temporizador ── */
.timer{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--brass-hi),var(--brass));transition:width .25s linear}
.timer.hot i{background:linear-gradient(90deg,#FF8A80,var(--danger));animation:pulse .5s infinite}

/* ── traspaso de móvil ── */
#handoff{
  position:absolute;inset:0;z-index:60;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center;
  background:radial-gradient(80% 50% at 50% 40%,#1C1018,#08050700 70%),#060406
}
#handoff.on{display:flex;animation:fade .35s ease}
#handoff .lock{font-size:64px;animation:pulse 2.2s infinite}

/* ── superposiciones ── */
#toast{
  position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:70;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%
}
.toast{
  padding:10px 16px;border-radius:99px;border:1px solid var(--brass-dim);
  background:rgba(26,15,21,.96);font-size:13.5px;font-weight:600;text-align:center;
  animation:fade .25s ease;box-shadow:0 10px 30px -10px #000
}
#fx{position:absolute;inset:0;pointer-events:none;z-index:65;width:100%;height:100%}
.blackout{position:absolute;inset:0;z-index:80;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.count{font-family:var(--f-disp);font-size:120px;color:var(--brass-hi);animation:zoom .9s ease}

/* ── cartas ── */
.card{
  position:relative;border:1px solid var(--line2);border-radius:12px;padding:10px;
  background:linear-gradient(160deg,#2E1C27,#180E14);overflow:hidden;text-align:left
}
.card.playable{border-color:var(--brass-dim);cursor:pointer}
.card.playable:active{transform:scale(.97)}
.card .ce{font-size:26px}
.card .cn{font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.card .cd{font-size:11px;color:var(--mute);line-height:1.35;margin-top:3px}
.card .shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(242,218,146,.22) 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.5s ease-in-out infinite}
.card.used{opacity:.3;filter:grayscale(1)}

/* ── mercado ── */
.mkt{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.mktcell{flex:0 0 auto;padding:6px 9px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.02);text-align:center;min-width:62px}
.mktcell .v{font-family:var(--f-num);font-size:12px;font-weight:600}
.news{border-left:3px solid var(--brass);padding:8px 0 8px 11px;font-size:14px}
.news .src{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass-dim);font-weight:700}

/* ── inventario ── */
.inv{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:rgba(255,255,255,.025);border:1px solid var(--line)}
.inv .e{font-size:26px;flex:0 0 auto}
.inv .n{font-size:13.5px;font-weight:600;line-height:1.2}

/* ── animaciones ── */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes zoom{from{opacity:0;transform:scale(.4)}60%{opacity:1}to{opacity:1;transform:scale(1)}}
@keyframes slam{from{transform:scale(1.12) translateX(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{0%,55%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-5px)}}
.shake{animation:shake .4s}
.pop{animation:zoom .4s cubic-bezier(.2,1.6,.4,1)}
:fullscreen #shell, :-webkit-full-screen #shell{height:100vh;height:100dvh;max-height:100dvh}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
@media (max-height:680px){
  .plate .obj{font-size:56px}h1{font-size:26px}.bidnum{font-size:34px}
  .btn{min-height:50px}
}
</style>

<script>

const $ = s => document.querySelector(s);
const stage = $('#stage'), topbar = $('#topbar'), dock = $('#dock'), hoff = $('#handoff');
const rnd = (a,b) => a + Math.random()*(b-a);
const ri = (a,b) => Math.floor(rnd(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const shuffle = a => {const r=a.slice();for(let i=r.length-1;i>0;i--){const j=ri(0,i);[r[i],r[j]]=[r[j],r[i]];}return r;};
const money = n => {
  const v = Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (n<0?'−€':'€') + v;
};
const pct = n => (n>=0?'+':'') + Math.round(n) + '%';
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const round50 = n => Math.round(n/50)*50;

/* ─── PANTALLA COMPLETA ────────────────────────────────────── */
const FS = {
  wl:null,
  activo(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); },
  async wake(){ try{ if('wakeLock' in navigator && !this.wl) this.wl = await navigator.wakeLock.request('screen'); }catch(e){} },
  async toggle(){
    const e = document.documentElement;
    try{
      if(this.activo()){
        const salir = document.exitFullscreen || document.webkitExitFullscreen;
        if(salir) await salir.call(document);
        if(this.wl){ try{ this.wl.release(); }catch(x){} this.wl = null; }
        return true;
      }
      const pedir = e.requestFullscreen || e.webkitRequestFullscreen;
      if(!pedir) return false;
      await pedir.call(e, {navigationUI:'hide'});
      this.wake();
      return true;
    }catch(err){ return false; }
  }
};

/* ─── 3. AUDIO + HÁPTICA ───────────────────────────────────── */
const AU = {ctx:null, on:true, vib:true,
  init(){ if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
          if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f,dur,type='sine',vol=.18,slide=0,delay=0){
    if(!this.on||!this.ctx) return;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide), t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t+dur+.05);
  },
  noise(dur=.25,vol=.12){
    if(!this.on||!this.ctx) return;
    const n = this.ctx.sampleRate*dur, buf = this.ctx.createBuffer(1,n,this.ctx.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n,2);
    const s = this.ctx.createBufferSource(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
    f.type='bandpass'; f.frequency.value=1400; g.gain.value=vol;
    s.buffer=buf; s.connect(f); f.connect(g); g.connect(this.ctx.destination); s.start();
  },
  vibrate(p){ if(this.vib && navigator.vibrate) try{navigator.vibrate(p);}catch(e){} }
};
const SFX = {

let S = null;

  const m = {};
  CATKEYS.forEach(c=>{ m[c] = {idx:1, trend:rnd(-.02,.03), dem:ri(42,68), crash:0}; });
  return m;
}
function newGame(n1,n2){
  const objs = shuffle(OBJECTIVES);
  S = {
    round:0, phase:'', players:[newPlayer(0,n1||'JUGADOR 1'), newPlayer(1,n2||'JUGADOR 2')],
    market:newMarket(), lot:null, fmt:'abierta', pool:shuffle(ITEMS), legends:shuffle(LEGENDS),

  };
  S.players[0].obj = objs[0]; S.players[1].obj = objs[1];
  S.players.forEach(p=>{ drawCard(p); drawCard(p); });
}
const P = i => S.players[i];
function feud(pid, n, why){
  S.feud[pid] += (n||1);
  S.feudLog = (S.feudLog||[]).concat([{p:pid, why}]).slice(-6);
}
function serieKey(){
  const n = [P(0).name, P(1).name].map(x=>x.toUpperCase());
  return 'serie:' + n.slice().sort().join('|');
}
function getSerie(){
  const m = meta(), k = serieKey();
  return (m.series && m.series[k]) || {};
}
function addSerie(name){
  const m = meta(), k = serieKey();
  m.series = m.series || {};
  m.series[k] = m.series[k] || {};
  m.series[k][name] = (m.series[k][name]||0) + 1;
  m.lastKey = k;
  m.lastNames = [P(0).name, P(1).name];
  saveMeta(m);
  return m.series[k];
}
const RIVAL = i => S.players[1-i];
function drawCard(p,forced){
  if(p.cards.length>=5) return null;
  const k = forced || pick(CARDPOOL);
  p.cards.push({k, id:Math.random().toString(36).slice(2,8)});
  return k;
}

/* ─── 5. MERCADO Y VALOR ───────────────────────────────────── */
function catMult(cat){
  const m = S.market[cat];
  return m.idx * (0.86 + 0.28*(m.dem/100));
}
function trueValue(it){
  const m = S.market[it.cat];
  const v = it.base * m.idx * (0.80 + 0.40*((it.dem*0.5 + m.dem*0.5)/100));
  return Math.max(120, v);
}
function startPriceOf(L){ return Math.max(100, round50(estimate(L).lo * (L.legend?0.45:0.52))); }
function estimate(lot){
  const v = trueValue(lot) * (1 + lot.bias);
  const w = 0.13 + lot.vol*0.42 + (lot.risk.includes('A')?0.10:0);
  return {lo: round50(v*(1-w)), hi: round50(v*(1+w)), mid: round50(v)};
}
function advanceMarket(){
  S.nudges = (S.nudges||[]).filter(n=>{
    S.market[n.cat].trend += n.dir * 0.035;
    n.left--;
    return n.left > 0;
  });
  CATKEYS.forEach(c=>{
    const m = S.market[c];
    if(m.crash>0){ m.crash--; if(m.crash===0) m.idx /= 0.82; }
    m.trend = clamp(m.trend*0.72 + rnd(-.035,.035), -.10, .12);
    m.idx = clamp(m.idx * (1 + m.trend), .45, 2.6);
    m.dem = clamp(m.dem + ri(-6,6) + Math.round(m.trend*60), 12, 98);
  });
}
function applyNews(n){
  if(!n.c){ CATKEYS.forEach(c=>{ S.market[c].trend += n.dir*0.02; }); return; }
  S.market[n.c].trend += n.dir * rnd(.03,.07);
  S.market[n.c].dem = clamp(S.market[n.c].dem + n.dir*ri(4,11), 10, 98);
}
function applyEvent(ev){
  const hit = ev.c ? [ev.c] : CATKEYS;
  hit.forEach(c=>{
    S.market[c].idx = clamp(S.market[c].idx * (1+ev.p), .40, 2.8);
    S.market[c].dem = clamp(S.market[c].dem + Math.round(ev.p*60), 10, 98);
    S.market[c].trend += ev.p*0.25;
  });
  S.eventLog.push(ev.t);
}

/* ─── 6. MOTOR DE PANTALLAS ────────────────────────────────── */
const ACT = {};
function clearTimers(){ S && S.tm.forEach(t=>{clearTimeout(t);clearInterval(t);}); if(S) S.tm=[]; }
function later(fn,ms){ const t=setTimeout(fn,ms); S.tm.push(t); return t; }
function every(fn,ms){ const t=setInterval(fn,ms); S.tm.push(t); return t; }
function render(o){
  clearTimers();
  if(o.top===null){ topbar.classList.add('hide'); } else { topbar.classList.remove('hide'); topbar.innerHTML = o.top || topHTML(); }
  stage.innerHTML = o.body || '';
  dock.innerHTML = o.dock || '';
  stage.scrollTop = 0;
}
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  if(!t) return;
  AU.init();
  const fn = ACT[t.dataset.act];
  if(fn){ if(!t.dataset.quiet) SFX.tap(); fn(t); }
});
function toast(msg,ms){
  const d = document.createElement('div');
  d.className='toast'; d.innerHTML = msg; $('#toast').appendChild(d);
  setTimeout(()=>{ d.style.opacity='0'; d.style.transition='opacity .4s'; setTimeout(()=>d.remove(),400); }, ms||2200);
}
function topHTML(){
  const mk = CATKEYS.map(c=>{
    const m = S.market[c], d = (m.idx-1)*100;

    return `<div class="mktcell"><div style="font-size:15px">${CATS[c].e}</div><div class="v ${cls}">${pct(d)}</div></div>`;
  }).join('');
  return `<div style="width:100%">
    <div class="row sb" style="margin-bottom:6px">
      <div class="lbl gold">RONDA ${S.round}<span style="color:var(--mute2)"> / 25</span></div>

    </div>
    <div class="mkt">${mk}</div>
  </div>`;
}

}

<script>
/* ─── 12. RONDA: PREPARACIÓN ───────────────────────────────── */
function feeFactor(p){ return p.rep>=8 ? .95 : p.rep<=2 ? 1.05 : 1; }
function maxBid(p){ return Math.max(0, round50(Math.floor(p.cash / feeFactor(p)) - 25)); }
function patrimonio(p){ return p.cash + p.inv.reduce((a,i)=>a+trueValue(i),0) - p.debt; }
function cashBand(p){
  const c = p.cash;
  if(c>9000) return {t:'FORRADO',e:'🤑'}; if(c>6000) return {t:'SOLVENTE',e:'😎'};
  if(c>3500) return {t:'AJUSTADO',e:'😬'}; if(c>1200) return {t:'CON LO JUSTO',e:'😰'};
  return {t:'EN LA RUINA',e:'💀'};
}
function assignTips(){
  S.players.forEach(p=>{
    const cat = Math.random()<.55 ? S.lot.cat : pick(CATKEYS);
    const tpl = pick(TIPS);
    const truth = Math.random()<.72;
    if(truth) S.nudges.push({cat, dir:tpl.dir, left:ri(2,4)});
    p.tip = {cat, dir:tpl.dir, txt:tpl.t(cat), truth};
  });
}
function startRound(){
  S.round++;
  S.phase = '';
  if(S.round>25){ finale(); return; }
  S.nudges = S.nudges || [];
  advanceMarket();
  S.players.forEach(p=>{ p.blocked=false; p.farol=false; p.tanteo=false; p.taunted=false; p.venge=false; p.know=null; p.spied=false; });
  S.startPlayer = (S.round-1)%2;
  const legend = S.round%5===0;
  const raw = legend ? (S.legends.pop() || pick(LEGENDS)) : (S.pool.pop() || pick(ITEMS));
  S.lot = {name:raw[0], e:raw[1], cat:raw[2], base:raw[3], rar:raw[4], dem:raw[5], vol:raw[6],
           risk:raw[7]||'', set:raw[8]||'', legend, bias:rnd(-.14,.14), id:'L'+S.round};
  S.fmt = ROUNDPLAN[S.round-1];
  S.news = [];
  const n1 = pick(NEWS); applyNews(n1); S.news.push(n1);
  if(Math.random()<.55){ const n2 = pick(NEWS); if(n2!==n1){ applyNews(n2); S.news.push(n2); } }
  S.event = null;
  if(S.round>=3 && S.round%3===0){ S.event = pick(EVENTS); applyEvent(S.event); }
  S.bet = null; S.betResult = null;
  S.bounty = null;
  const hot = S.players.find(x=>x.st.racha >= 2);
  if(hot) S.bounty = {target:hot.id, racha:hot.st.racha, cash:400};
  const titan = S.round >= 21;
  S.income = [0,0];
  if(S.round > 1){
    S.players.forEach(p=>{
      const inc = Math.round((250 + p.inv.length*60 + Math.round(p.rep*25)) * (titan?2:1));
      p.cash += inc; S.income[p.id] = inc;
    });
  }
  assignTips();
  S.seenFmt = S.seenFmt || {};
  if(S.round === 21 && !S.titanHour){ S.titanHour = true; return screenTitanHour(); }
  screenNews();
}

function bidHint(v, est){
  if(v<=0) return 'No pujas por este lote.';
  const r = v/est.mid;
  if(r<.5) return 'Muy por debajo de la estimación.';
  if(r<.85) return 'Por debajo de la estimación.';
  if(r<1.15) return 'En línea con la estimación de la casa.';
  if(r<1.6) return 'Por encima de la estimación. Te lo quieres llevar.';
  return 'Una barbaridad. O sabes algo, o te vas a arruinar.';
}
function syncBid(){
  const p = P(curP), est = estimate(S.lot);

  const n = $('#bidNum'), r = $('#bidRange'), h = $('#bidHint');
  if(n) n.textContent = money(bidVal);
  if(r) r.value = bidVal;
  if(h) h.textContent = bidHint(bidVal, est);
}
ACT.bidAdd = t => { bidVal += +t.dataset.d; syncBid(); SFX.tick(); };
ACT.bidSet = t => { bidVal = +t.dataset.v; syncBid(); SFX.bid(); };

let bidSubmit = 'confirmSealed';
function startBidClock(){
  let t = 40;

  every(()=>{
    t--;
    if(bar) bar.style.width = (t/40*100)+'%';
    if(lab) lab.textContent = t+' s';

};
function nextPrivate(){
  clearTimers();

  if(sealed() && p.blocked) p.bid = 0;

  } else {
    startAuction();
  }
}

<script>

function consume(p, id){ const i = p.cards.findIndex(c=>c.id===id); if(i>=0) p.cards.splice(i,1); p.st.cartas++; }
ACT.playCard = t => {
  const p = P(curP), id = t.dataset.id, c = p.cards.find(x=>x.id===id);
  if(!c) return;
  const R = RIVAL(curP), L = S.lot;
  switch(c.k){
    case 'tasacion':{
      const v = trueValue(L);
      p.know = {lo:round50(v*rnd(.90,.94)), hi:round50(v*rnd(1.06,1.10))};
      consume(p,id); SFX.card(); toast('🔍 Tasación realizada'); break;
    }
    case 'bloqueo':{
      R.blocked = true; p.rep = clamp(p.rep-1,0,10); consume(p,id); SFX.down();
      toast('🛑 Has bloqueado al rival en este lote'); break;
    }
    case 'subsidio':{
      p.cash += 500; consume(p,id); SFX.coin(); toast('💰 +500 monedas'); break;
    }
    case 'farol':{
      p.farol = true; consume(p,id); SFX.card();
      toast(sealed()?'🎭 Tu oferta se abrirá distorsionada'
        :'🎭 Tus pujas se verán un 30% más altas de lo que pagarás', 3200); break;
    }
    case 'doble':{
      p.doble = true; consume(p,id); SFX.card(); toast('⚡ Tu mejor colección contará doble'); break;
    }
    case 'tanteo':{
      p.tanteo = true; consume(p,id); SFX.card(); toast('📜 Derecho de tanteo activado'); break;
    }
    case 'espionaje':{
      const rc = R.cards.length ? CARDS[pick(R.cards).k].n : 'ninguna carta';
      p.spyInfo = `Efectivo del rival: <b class="gold">${money(R.cash)}</b>.<br>Tiene en la mano: <b>${rc}</b>.<br>Su soplo dice: “${R.tip.txt}”`;
      p.rep = clamp(p.rep-1,0,10); consume(p,id); SFX.card(); break;
    }
    case 'crash':{
      renderChooser('💣 ¿QUÉ CATEGORÍA HUNDES?', CATKEYS.map(k=>({v:k, l:`${CATS[k].e} ${CATS[k].n}`, s:`índice ${pct((S.market[k].idx-1)*100)}`})), 'doCrash', id);
      return;
    }
    case 'seguro':{
      if(!p.inv.length){ toast('No tienes objetos que asegurar'); return; }
      renderChooser('🛡️ ¿QUÉ OBJETO ASEGURAS?', p.inv.map((it,i)=>({v:i, l:`${it.e} ${it.name}`, s:CATS[it.cat].n})), 'doSeguro', id);
      return;
    }
    case 'intercambio': toast('🔄 Esta carta se juega en la fase de negociación'); return;
  }
  renderPrivate(curP);
};
function renderChooser(title, opts, act, cardId){

    <div class="stack" style="gap:8px">${opts.map(o=>`<button class="btn" style="justify-content:flex-start" data-act="${act}" data-v="${o.v}" data-card="${cardId}">
      <span class="btn-col" style="align-items:flex-start">${o.l}<span class="sub">${o.s}</span></span></button>`).join('')}</div>

  A.high = A.turn;
  A.passes = 0;

<script>

function winnerRealPrice(){

function hammerDown(){

function desierto(){

/* ─── 17. RESOLUCIÓN ───────────────────────────────────────── */
function acquire(p, price, extra){
  const L = S.lot;
  const it = {name:L.name, e:L.e, cat:L.cat, base:L.base, rar:L.rar, dem:L.dem, vol:L.vol,
              risk:L.risk, set:L.set, legend:L.legend, paid:price, round:S.round, bias:L.bias};
  p.inv.push(it);
  p.cash -= price;
  p.st.gastado += price; p.st.pagadoTotal += price;
  p.st.maxPago = Math.max(p.st.maxPago, price);
  p.st.ganadas++;
  p.st.racha++; p.st.maxRacha = Math.max(p.st.maxRacha, p.st.racha);
  RIVAL(p.id).st.racha = 0;
  if(sealed()) p.st.sobresGanados++;
  const est = estimate(L);
  if(price < est.mid*0.45) p.st.ganga = true;
  if(price > est.hi*1.35){ p.st.curse++; p.rep = clamp(p.rep+0.5,0,10); }
  p.rep = clamp(p.rep + 0.4, 0, 10);
  if(p.taunted) p.rep = clamp(p.rep + 1, 0, 10);
  const R = RIVAL(p.id);
  if(R.taunted) R.rep = clamp(R.rep - 1, 0, 10);
  if(S.round >= 21) p.st.prestigio += 150;
  S.corteHecho = false;
  if(S.bounty && S.bounty.target !== p.id){
    p.cash += S.bounty.cash; drawCard(p); p.st.cortes++;
    feud(p.id, 1, 'corte'); S.corteHecho = true;
  }
  const rivalPeleo = S.fmt==='holandesa' ? true
    : sealed() ? (R.bid > 0)
    : (S.A && S.A.hist.some(h=>h.p !== p.id));
  if(rivalPeleo) feud(p.id, 1, 'lote');
  S.betResult = resolveBet(price);
  return it;
}
function finalPrice(pid, base){
  let price = base;
  if(P(pid).venge) price = round50(price*1.15);
  price = round50(price * feeFactor(P(pid)));
  return price;
}
function resolveOpen(w, h){
  clearTimers();
  const base = h.real;
  let price = finalPrice(w, base);
  const p = P(w);
  if(price > p.cash) price = Math.floor(p.cash);
  const it = acquire(p, price, {});
  const loser = 1 - w;
  let prima = 0;
  if(S.A.hist.some(x=>x.p === loser)){
    prima = Math.min(400, round50(price*0.06));
    P(loser).cash += prima; P(loser).st.primas += prima;
  }
  if(S.A.sniped === w){ p.st.robos++; feud(w, 1, 'robo'); }
  const bluffLost = S.A.hist.filter(x=>x.ghost && x.p!==w).pop();
  S.result = {winner:w, price, base, ghost:h.ghost, shown:h.shown, item:it, venge:p.venge,
              fee:feeFactor(p), bluffLost: bluffLost || null, bluffer: bluffLost ? P(1-w).name : null,
              prima, primaFor: prima ? P(loser).name : null, sniped: S.A.sniped === w};
  SFX.buy();
  screenResult();
}
/* ── sobres cerrados ── */
function revealSealed(){
  clearTimers();
  const b0 = P(0).bid||0, b1 = P(1).bid||0;
  if(b0<=0 && b1<=0) return desierto();
  if(b0===b1) return duelo();
  const w = b0>b1 ? 0 : 1, l = 1-w, hi = Math.max(b0,b1), lo = Math.min(b0,b1);
  let base;
  if(S.fmt==='sobre1' || S.fmt==='guerra') base = hi;
  else if(S.fmt==='sobre2') base = Math.max(lo, S.A.start);
  else base = round50((hi+lo)/2);
  revealAnim(b0,b1,()=>{
    const price = Math.min(finalPrice(w, base), Math.floor(P(w).cash));
    const it = acquire(P(w), price, {});
    let alsoPaid = 0;
    if(S.fmt==='guerra' && lo>0){
      alsoPaid = Math.min(lo, Math.floor(P(l).cash));
      P(l).cash -= alsoPaid; P(l).st.gastado += alsoPaid;
      P(l).rep = clamp(P(l).rep - 0.3, 0, 10);
    }
    const margen = hi - lo;
    S.result = {winner:w, price, base, bids:[b0,b1], alsoPaid, loser:l, item:it,
                venge:P(w).venge, fee:feeFactor(P(w)),
                margen: (lo>0 && margen <= Math.max(300, hi*0.06)) ? margen : 0};
    SFX.buy();
    screenResult();
  });
}
function revealAnim(b0,b1,done){

<script>

function screenResult(){

  const w = r.winner, p = P(w), col = w?'p2':'p1', l = 1-w;
  const rel = (r.price/est.mid-1)*100;
  const lector = rel < -25 ? {t:'POR DEBAJO DE LA ESTIMACIÓN',e:'🧊'} : rel > 30 ? {t:'MUY POR ENCIMA DE LA ESTIMACIÓN',e:'🔥'} : {t:'EN LÍNEA CON LA ESTIMACIÓN',e:'⚖️'};
  const extras = [];
  if(r.ghost) extras.push(`🎭 <b>FAROL DESCUBIERTO</b>: aparentaba ${money(r.shown)} y en realidad paga ${money(r.base)}.`);
  if(r.bluffLost) extras.push(`🎭 <b>${esc(r.bluffer)} iba de farol</b>: su puja de ${money(r.bluffLost.shown)} eran en realidad ${money(r.bluffLost.real)}. Le has ganado a un fantasma.`);
  if(r.venge) extras.push(`😤 <b>PRIMA DE VENGANZA</b>: +15% sobre su puja.`);
  if(r.fee && r.fee!==1) extras.push(r.fee<1?`⭐ La casa le hace un <b>−5%</b> por reputación.`:`⚠️ La casa le cobra un <b>+5%</b> de recargo por reputación.`);
  if(r.alsoPaid) extras.push(`⚔️ <b>${esc(P(r.loser).name)}</b> también paga su oferta: <b class="down">−${money(r.alsoPaid)}</b>.`);
  if(r.duelo) extras.push(r.early
    ? `⚔️ <b>Duelo de pulgares</b>: ${esc(r.loserName)} pulsó antes de tiempo.`

ACT.tanteo = () => {
  const r = S.result;
  if(!r || r.stolen || r.winner===null) return;
  const l = 1 - r.winner, lp = P(l), wp = P(r.winner);
  if(!lp.tanteo) return;
  const price = round50(r.price*1.25);
  if(price > maxBid(lp)){ toast('❌ No tienes fondos para ejercer el tanteo'); return; }
  const idx = wp.inv.findIndex(i=>i.round===S.round);
  if(idx<0){ toast('Ya no es posible'); return; }
  const it = wp.inv.splice(idx,1)[0];
  wp.cash += r.price; wp.st.ganadas--; wp.st.gastado -= r.price;
  it.paid = price;
  lp.inv.push(it); lp.cash -= price; lp.st.gastado += price; lp.st.ganadas++;
  lp.st.maxPago = Math.max(lp.st.maxPago, price);
  lp.tanteo = false;
  lp.st.robos++; feud(l, 1, 'robo');
  SFX.hammer(); AU.vibrate([60,40,60]);
  S.result = Object.assign({}, r, {winner:l, price, stolen:true, from:wp.name});
  toast(`📜 <b>${esc(lp.name)}</b> arrebata el lote por ${money(price)}`, 3000);
  later(()=>screenResult(), 400);
};

function drawSpark(p){
  const c = $('#spark'); if(!c) return;
  const w = c.clientWidth || 300, h = 70;
  c.width = w*2; c.height = h*2;
  const x = c.getContext('2d'); x.scale(2,2);
  const d = p.hist.slice(-14);
  if(d.length<2) return;
  const mn = Math.min(...d)*0.95, mx = Math.max(...d)*1.05, rg = Math.max(1,mx-mn);
  const px = i => i/(d.length-1)*(w-6)+3, py = v => h-4-((v-mn)/rg)*(h-12);
  x.beginPath(); x.moveTo(px(0), h);
  d.forEach((v,i)=>x.lineTo(px(i), py(v)));
  x.lineTo(px(d.length-1), h); x.closePath();
  const g = x.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'rgba(201,162,39,.35)'); g.addColorStop(1,'rgba(201,162,39,0)');
  x.fillStyle = g; x.fill();
  x.beginPath(); d.forEach((v,i)=> i?x.lineTo(px(i),py(v)):x.moveTo(px(i),py(v)));
  x.strokeStyle = '#F2DA92'; x.lineWidth = 2; x.stroke();
  x.beginPath(); x.arc(px(d.length-1), py(d[d.length-1]), 3.5, 0, 7); x.fillStyle='#F2DA92'; x.fill();
}

/* ─── 21. COLECCIONES ──────────────────────────────────────── */
function collections(p, finalMode){
  const detail = [], byCat = {}, bySet = {};
  p.inv.forEach(it=>{
    byCat[it.cat] = (byCat[it.cat]||0)+1;
    if(it.set) bySet[it.set] = (bySet[it.set]||0)+1;
    if(finalMode && it.fake) { it.penal = true; }
  });
  let total = 0, best = 0;
  Object.keys(byCat).forEach(c=>{
    const n = byCat[c];
    let pts = 0;
    if(n>=5) pts = 900; else if(n>=4) pts = 560; else if(n>=3) pts = 300;
    if(pts){ total += pts; best = Math.max(best,pts);
      detail.push({n:`${CATS[c].e} ${n} × ${CATS[c].n}`, pts}); }
    else if(n===2) detail.push({n:`${CATS[c].e} ${CATS[c].n}`, pts:0, prog:`${n}/3`});
  });
  Object.keys(bySet).forEach(k=>{
    const s = SETS[k], n = bySet[k];
    let pts = 0;
    if(n>=s.full) pts = s.fullBonus; else if(n>=s.need) pts = s.bonus;
    if(pts){
      const fakes = p.inv.filter(i=>i.set===k && i.fake).length;
      if(fakes){ pts = Math.max(0, pts - 200*fakes); detail.push({n:`${s.e} ${s.n} (pieza falsa)`, pts}); }
      else detail.push({n:`${s.e} ${s.n} ${n>=s.full?'COMPLETA':''}`, pts});
      total += pts; best = Math.max(best,pts);
    } else detail.push({n:`${s.e} ${s.n}`, pts:0, prog:`${n}/${s.need}`});
  });
  if(p.doble && best){ total += best; detail.push({n:'⚡ DOBLE (mejor colección ×2)', pts:best}); }
  return {total, detail, best};
}

/* ─── 22. RECUENTO FINAL ───────────────────────────────────── */
function resolveAll(){
  S.players.forEach(p=>{
    p.inv.forEach(it=>{
      let mult = 1; const notes = [];
      const seg = it.seguro;
      if(it.risk.includes('A')){
        if(seg){ notes.push({i:'🛡️', t:'PERITADO Y AUTÉNTICO'}); }
        else if(Math.random() < 0.24){ it.fake = true; mult *= 0.13; notes.push({i:'❌', t:'FALSIFICACIÓN'}); }
        else notes.push({i:'✅', t:'AUTENTICIDAD CONFIRMADA'});
      }
      if(it.risk.includes('V') && !it.fake){
        const v = seg ? rnd(1.0,1.7) : rnd(.55,1.85);
        mult *= v;
        notes.push(v>1.15?{i:'🚀',t:'SE DISPARA'}:v<0.85?{i:'📉',t:'SE DESPLOMA'}:{i:'〰️',t:'AGUANTA EL TIPO'});
      }
      if(it.risk.includes('M') && !it.fake){ const v = rnd(.80,1.22); mult *= v; notes.push(v>1?{i:'📈',t:'MERCADO A FAVOR'}:{i:'📉',t:'MERCADO EN CONTRA'}); }
      if(it.risk.includes('D') && !it.fake){ const v = rnd(.82,1.06); mult *= v; notes.push({i:'💧',t:'DEMANDA FLOJA'}); }
      if(!it.risk){ mult *= rnd(.93,1.15); }
      if(it.legend && !it.fake){ mult *= 1.12; notes.push({i:'👑',t:'PIEZA LEGENDARIA'}); }
      it.finalVal = Math.max(50, Math.round(trueValue(it) * mult));
      it.notes = notes.length?notes:[{i:'⚖️',t:'SIN SORPRESAS'}];
      it.delta = (it.finalVal/Math.max(1,it.paid)-1)*100;
    });
  });
}
function scorePlayer(p){
  const invVal = p.inv.reduce((a,i)=>a+i.finalVal,0);
  const pat = Math.round(p.cash + invVal - p.debt);
  const col = collections(p, true);
  const objOk = (()=>{ try{ return !!p.obj.chk(p, RIVAL(p.id)); }catch(e){ return false; } })();
  const repPts = Math.round(p.rep*10);
  const legPts = p.inv.filter(i=>i.legend).length*60;
  const penal = p.st.curse*25 + p.inv.filter(i=>i.fake).length*40;
  const pts = Math.round(pat/30) + col.total + repPts + (objOk?p.obj.p:0) + legPts + p.st.prestigio - penal;
  const deltas = p.inv.map(i=>({n:i.name, e:i.e, d:i.delta}));
  const best = deltas.length ? deltas.reduce((a,b)=>b.d>a.d?b:a) : null;
  const worst = deltas.length ? deltas.reduce((a,b)=>b.d<a.d?b:a) : null;
  const dearest = p.inv.length ? p.inv.reduce((a,b)=>b.paid>a.paid?b:a) : null;
  return {pat, invVal, col, objOk, repPts, legPts, penal, pts, best, worst, dearest};
}

/* ─── 23. CONFETI ──────────────────────────────────────────── */
function confetti(){
  const c = $('#fx'), sh = $('#shell');
  const w = sh.clientWidth, h = sh.clientHeight;
  c.width = w*2; c.height = h*2;
  const x = c.getContext('2d'); x.scale(2,2);
  const cols = ['#F2DA92','#C9A227','#D9534B','#5C86D6','#F4EADA'];
  const ps = [];
  for(let i=0;i<130;i++) ps.push({x:Math.random()*w, y:-Math.random()*h*.6, vy:rnd(1.4,4.2), vx:rnd(-1,1),
    s:rnd(4,9), r:Math.random()*6, vr:rnd(-.2,.2), c:pick(cols)});
  let f = 0;
  const loop = () => {
    x.clearRect(0,0,w,h);
    ps.forEach(p=>{
      p.y += p.vy; p.x += p.vx; p.r += p.vr;
      if(p.y > h+20){ p.y = -20; p.x = Math.random()*w; }
      x.save(); x.translate(p.x,p.y); x.rotate(p.r);
      x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62); x.restore();
    });
    f++;
    if(f<420) requestAnimationFrame(loop); else x.clearRect(0,0,w,h);
  };
  loop();
}

        <div class="tiny">Pagas ${money(g.price)} y es tuyo${g.price>me.cash?' · NO TE LLEGA':''}</div></div></div></div>
      <div class="panel"><div class="lbl">OPCIÓN B · LE VENDES</div>
        <div class="row" style="gap:10px;margin-top:6px"><div style="font-size:32px">${b.e}</div>
        <div style="flex:1"><b style="font-size:14px">${esc(b.name)}</b>
        <div class="tiny">Cobras ${money(g.price)} y se lo queda él</div></div></div></div>
    </div>`, dock:`<div class="grid2">
      <button class="btn pri" data-act="gunBuy" ${g.price>me.cash?'disabled':''}>COMPRO</button>
      <button class="btn p2" data-act="gunSell">VENDO</button></div>`});
  });
};
ACT.gunBuy = () => {
  const g = S.gun; if(!g) return;
  S.gun = null;
  const seller = P(g.by), buyer = RIVAL(g.by), it = seller.inv[g.mine];
  if(!it || g.price > buyer.cash){ toast('Ya no es posible'); return later(()=>negoIntro(), 500); }
  seller.inv.splice(g.mine,1);
  seller.cash += g.price; buyer.cash -= g.price;
  it.paid = g.price; buyer.inv.push(it);
  SFX.buy(); toast(`🔫 ${esc(buyer.name)} se queda ${esc(it.name)} por ${money(g.price)}`, 3000);
  later(()=>negoIntro(), 1000);
};
ACT.gunSell = () => {
  const g = S.gun; if(!g) return;
  S.gun = null;
  const buyer = P(g.by), seller = RIVAL(g.by), it = seller.inv[g.theirs];
  if(!it || g.price > buyer.cash){ toast('Ya no es posible'); return later(()=>negoIntro(), 500); }
  seller.inv.splice(g.theirs,1);
  seller.cash += g.price; buyer.cash -= g.price;
  it.paid = g.price; buyer.inv.push(it);
  SFX.buy(); toast(`🔫 ${esc(buyer.name)} se lleva ${esc(it.name)} por ${money(g.price)}`, 3000);
  later(()=>negoIntro(), 1000);
};
</script>
